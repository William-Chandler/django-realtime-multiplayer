<p>{% include "core/header.html" with next_url=request.get_full_path %}</p>

<h2>Create a room</h2>

<form method="POST">
    {% csrf_token %}
    <label>Room Name:</label>
    <input type="text" name="room_id" value="{{ room_id }}" required>

    <label>Password:</label>
    <input type="password" name="password" required>

    <button type="submit">Create Room</button>

    {% if error %}
        <p style="color: red; margin-top: 10px;">{{ error }}</p>
    {% endif %}
</form>
