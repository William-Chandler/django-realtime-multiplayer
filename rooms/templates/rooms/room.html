<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multiplayer Demo</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { background: #111; display: block; }
    </style>
</head>
<body>
	
	{% include "core/header.html" with next_url=request.path %}
	
	<!-- Debug banner -->
	<div style="background:#222; color:#fff; padding:8px; margin-bottom:10px;">
		<span>Active Room: </span>
		<strong>{{ room.room_id }}</strong>
	</div>
	
	<!-- For debugging -->
	<script>
		window.SERVER_ROOM_ID = "{{ room.room_id }}";
	</script>
	
	<!-- Save / Load whiteboards controls -->
	<div id="whiteboard-controls">
		<input 
			id="board-name-input" 
			type="text" 
			placeholder="Whiteboard name..."
			style="margin-right:10px;"
		>
		
		<button id="save-board-btn">Save Whiteboard</button>

		{% if request.user == room.owner %}
		<select id="load-board-dropdown">
			<option value="">Load Saved Board...</option>
		</select>
		{% endif %}
		
		<span id="save-status" style="margin-top: 10px;"></span>

		
		
		{% load static %}

		<script type="module">
			const ROOM_ID = "{{ room.room_id }}";
			const CSRF_TOKEN = "{{ csrf_token }}";

			{% if request.user == room.owner %}
				const IS_OWNER = true;
			{% else %}
				const IS_OWNER = false;
			{% endif %}
			
			import { initWhiteboardControls } from "{% static 'core/whiteboard_save_load.js' %}?v=4";
			initWhiteboardControls(ROOM_ID, CSRF_TOKEN, IS_OWNER);
		</script>
		<p> </p>
	</div>


	<div id="canvas-container">
		{% load static %}

		<canvas id="game"></canvas>

		<script id="user-config" type="application/json">
		{
			"colour": "{{ user.userprofile.colour_preference }}"
		}
		</script>

		<script>
			const room_id = "{{ room.room_id }}";
		</script>

		<script src="{% static 'core/game.js' %}"></script>
	</div>
</body>
</html>
